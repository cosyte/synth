name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:43 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "43 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. Repo-specific extra jobs (e.g. an
  # examples smoke, an examples build) are added on top of this caller, never instead of it.
  # This repo ships a PHI scanner (scripts/phi-scan.ts), so the shared pipeline's optional PHI-scan
  # step is switched on. That step runs `pnpm phi-scan` with NO arguments, which is all-mode: it
  # walks src/, test/ and scripts/ AND then reads every other file git tracks, rather than the
  # staged set, so it does not depend on what a given push happened to touch.
  #
  # THE TWO HALVES ARE NOT THE SAME SCOPE, AND THIS ONE IS THE WIDER OF THEM. The pre-commit hook is
  # the --staged half and still narrows to those three roots, so a repo-root file carrying PHI, this
  # workflow included, is caught HERE and not at commit time. Read the header of scripts/phi-scan.ts
  # for why the widening is all-mode only.
  # The scanner is a floor, not the whole gate: the property suites are the real proof (see the
  # header of scripts/phi-scan.ts).
  #
  # actionlint runs on every event, the nightly run included. It used to be skipped on `schedule`,
  # because the shared job reported through reviewdog, which fails without the repository in the
  # event payload; since the reference below the shared job runs rhysd/actionlint's own release over
  # every tracked workflow file and reads no payload. Never pass `run-actionlint: false`: a job
  # skipped by a condition satisfies its required context, so the lint would stop gating while the
  # ruleset still lists `ci / actionlint`.
  #
  # Called at a published reference, never `@main` (ST37): a `workflows-*` release of cosyte/.github.
  # Those releases are immutable, so the tag names one commit, and every caller in this repository
  # moves to the next one together. The shared matrix default is Node 22, 24 and 26.
  #
  # The job id `ci` prefixes the required contexts (`ci / verify (22, ubuntu-latest)` and the rest):
  # rename it, or move a step out of the shared `verify`, and the ruleset requires a context nothing
  # emits, which leaves every pull request pending rather than red.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request
  # waits for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gate of every corpus generator
  #   (scripts/perf/), each with its self-check, never under coverage;
  # - `bench-compare` (pull requests only): bench/synth.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner. Advisory: it never fails, so never require it.
  # The testing standard's jobs run beside them too:
  # - `coverage-ratchet`: coverage held to quality-floor.json, and on a pull request every changed
  #   line that coverage counts must have run and no floor may be lowered or removed;
  # - `mutation` (pull requests only): the changed source files mutated with stryker.config.mjs,
  #   and every mutant in the changed lines killed;
  # - `bun`: the test suite under Bun, on Linux.
  # Not Deno yet. On this caller's first Deno run 340 tests failed, those that generate through a
  # parser: the peer loader in src/peer.ts calls `import.meta.resolve`, and inside the test runner's
  # module loader on Deno that call throws `TypeError: Invalid arguments`. Making the loader fall back
  # there is a change to published code, which takes a release of its own; `run-deno: true` joins
  # the inputs below with it.
  # The full mutation run is weekly-mutation.yml, and the deep property run nightly-properties.yml.
  #
  # `verify` runs on Linux and macOS, each on Node 22, 24 and 26. The Ubuntu legs keep the names the
  # ruleset requires; the macOS legs are new contexts, `ci / verify (<node>, macos-latest)`. Windows
  # runs every step of `verify` but one in the `windows` job below: see there.
  #
  # A skipped job satisfies a required check, so require `scaling-gate`, `coverage-ratchet` or
  # `mutation` only while its input below stays on. This caller and the two scheduled callers of
  # the testing standard are at the release of `398cd4ded647`; the other callers here move at the
  # next release that changes what they run.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true

  # `verify`'s steps on Windows, on Node 22, 24 and 26: every one but `pnpm attw`. Not the shared
  # `verify` on `windows-latest`: that leg runs `pnpm attw`, and the attw gate in
  # @cosyte/script-utils 0.1.10 starts `node_modules/.bin/attw` directly, which on Windows is a
  # `.cmd` shim Node cannot start without a shell (`spawnSync ... node_modules\.bin\attw ENOENT`).
  # What attw checks is the packed manifest and its types, the same bytes on every system, and the
  # Linux and macOS legs check them. Once a script-utils release runs that gate on Windows, add
  # "windows-latest" to `os` above and delete this job. Not a required context.
  windows:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm phi-scan
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      # The dual ESM/CJS smoke the shared `verify` runs after attw, over every published subpath.
      - run: pnpm smoke

  # ── THE ORACLE GATE ──────────────────────────────────────────────────────────────────────────
  #
  # ADDED ON TOP OF THE CALLER ABOVE, NEVER INSTEAD OF IT, which is what the banner on that caller
  # says repo-specific extra jobs do. Both jobs run on every pull request and on every push to main;
  # deleting either is a visible edit to this file.
  #
  # WHY IT EXISTS. Every "spec-clean" claim this package makes today is `artifact.warnings === []`,
  # where the artifact was built by the same library that reads it back, so a shared misreading of a
  # standard is invisible to the check and a consumer has no way to point at anybody but us. This job
  # asks somebody else: the HL7-maintained FHIR validator grades a declared, seeded corpus of
  # generated FHIR R4 artifacts against the US Core package this repository pins, and the validator's
  # own report is the verdict. THIS IS THE ONLY PLACE THE EXTERNAL VALIDATOR EXECUTES. Everything the
  # gate DECIDES is a pure function tested offline in `test/oracle/`, over reports committed as
  # hand-authored fixtures; what cannot be faked offline, and therefore only happens here, is the
  # validator actually looking at the output.
  #
  # NO `|| true` AND NO `continue-on-error`. A check that cannot fail is documentation, and this one
  # exists precisely to be able to say no. There is no severity downgrade, no warning-only mode and
  # no suppression list anywhere in the gate: when it reds, the sanctioned moves are to fix the
  # question, fix the artifact, or narrow the DECLARED corpus and publish the exclusion and its
  # reason in the coverage declaration.
  #
  # NO `setup-java` ACTION, DELIBERATELY. The GitHub-hosted Ubuntu image ships a JDK on PATH, so
  # taking a dependency on another third-party action to install one would add a supply-chain surface
  # to buy nothing. If an image ever stops shipping one, the `java -version` step below fails loudly
  # rather than the oracle silently reporting a run it could not perform.
  #
  # THE DOWNLOAD URLS COME OUT OF THE PIN, not out of this file, so `scripts/oracle/oracle-lock.json`
  # stays the single place the sources and their digests are recorded. The run itself verifies what
  # arrived against that pin BEFORE it generates or grades anything.
  #
  # `oracle` IS THE CHECK-RUN CONTEXT NAME, and it is deliberately NOT a required context on `main`
  # yet: requiring one no workflow has ever emitted there leaves every future pull request PENDING
  # and unmergeable with nothing saying why. Let it run on `main` first, read the real name off a
  # live check run, and only then extend the one existing ruleset in place.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner's own JDK. A missing one reds here, with a name, rather than inside the oracle.
      - name: Show the JRE the validator will run on
        run: java -version

      # THE PIN NAMES THE RELEASE, SO THERE IS NOTHING HERE TO RESOLVE. Every address in
      # scripts/oracle/oracle-lock.json identifies one published release or one registry version, so
      # the address asked for is the address recorded: `/releases/download/<tag>/<file>` for the
      # validator, `<package>/<version>` for the conformance package. An address that names no
      # version, and an artifact that cannot be fetched from the one it does name, both stop the job
      # here with the artifact named, rather than reaching the grading step with nothing to grade.
      #
      # WHAT IS DELIBERATELY NOT RECORDED IS WHERE THE FETCH ENDS UP. MEASURED, not assumed:
      # following a release download lands on a signed asset address naming a storage GUID and
      # carrying a short-lived token, and the first run of this job recorded that GUID as the
      # validator's "version". Redirects are still followed to GET the bytes; the end of the chain is
      # simply not what the run says it acquired.
      #
      # NO ADDRESS AND NO DIGEST IS WRITTEN IN THIS FILE. Both live in the pin, and the acquisition
      # reads them from it, so there is exactly one place either can be changed.
      #
      # THE ACQUISITION SCRIPT IS DELIBERATELY NOT NAMED `oracle:acquire`, WHICH IS THE OBVIOUS
      # SPELLING AND THE WRONG ONE. `test/oracle/ci-wiring.test.ts` asserts over this file AS TEXT,
      # and `pnpm run oracle` is a PREFIX of `pnpm run oracle:acquire`: a step spelled that way and
      # placed above the grading step is what an `indexOf` for the grading command finds first, so a
      # guard aimed at the gate silently reads this step instead. MEASURED, not feared: that is how
      # the "no `|| true` on the grading step" assertion was disarmed on this branch's first pass.
      # The assertion no longer locates a step by its command, and the command no longer aliases the
      # gate's, so neither half depends on the other being right. Do not rename this back, and do not
      # add another step whose command begins with `pnpm run oracle`.
      - name: Acquire the pinned validator and conformance package
        run: pnpm run acquire:oracle

      - name: Grade the declared corpus with the external validator
        run: pnpm run oracle

      # The verdict is printed by the run itself; this repeats the machine-readable record in the log
      # so a failed run leaves the whole thing behind rather than a tail.
      - name: Show the published verdict
        if: always()
        shell: bash
        run: cat .oracle/out/verdict.json || echo "no verdict was published"

  # ── THE CROSS-ENGINE DETERMINISM GATE ────────────────────────────────────────────────────────
  #
  # ADDED ON TOP OF THE CALLER ABOVE, NEVER INSTEAD OF IT, the same rule the oracle job follows.
  #
  # WHY IT EXISTS. This package sells one property above all others: a seed maps to bytes, so a
  # consumer can commit a golden fixture and diff against it forever. Every determinism assertion in
  # the test suite generates TWICE INSIDE ONE PROCESS, and a single process cannot disagree with
  # itself about the engine it is running on. A V8 or ICU change that shifted number formatting,
  # sort stability or key order between Node majors would land green, on every check, today.
  #
  # HOW IT IS OBSERVED. The declared seed corpus is generated once per DECLARED Node major, in its
  # own job, on its own runner. Each job carries out ONE THING: a report of digests and engine
  # identities, with no generated artifact content in it. A third job compares those reports and
  # fails when two engines disagree, naming the seed, the format and both engines and NEVER the
  # differing bytes: the corpus is reproducible from the seed, so anyone can regenerate both sides.
  #
  # THE ENGINE SET IS DECLARED IN scripts/determinism/determinism-policy.json AND RECONCILED AGAINST
  # THIS FILE. `engines.node` in package.json is an open-ended range and the shared pipeline's Node
  # matrix lives in another repository, so neither can say which majors are actually CHECKED. The
  # digest run refuses before generating anything unless the declared set, the range and the jobs
  # below agree, which is what stops this file and that declaration drifting apart.
  #
  # NO THIRD-PARTY ARTIFACT ACTION, DELIBERATELY, for the same reason there is no `setup-java`
  # above: a report is a few kilobytes of hex digests, a job output carries it, and taking a
  # supply-chain dependency on another action to move it would buy nothing.
  #
  # NO `|| true` AND NO `continue-on-error`. A check that cannot fail is documentation.
  #
  # AND NO `if:` ON ANY OF THE THREE JOBS BELOW, OR ON ANY STEP INSIDE THEM. NOT EVEN A REASONABLE
  # ONE. A check that never runs is worse than one that cannot fail: a `needs:` on a SKIPPED job
  # skips the dependent, and GitHub reports a skipped job as SUCCESS for a required status check, so
  # one line here turns the whole cross-engine gate off AND GREEN. The route this is really about is
  # not sabotage: `if: github.event_name != 'pull_request'` on the Node 24 job, added in good faith
  # to save CI minutes, would turn this gate off on every pull request, which is every run anybody
  # looks at. `strategy:` is refused on these jobs for the neighbouring reason (a matrix decides how
  # many times a job runs and on what, and legs share one `outputs` map), and the two `branches:
  # [main]` triggers at the top of this file are read as well, because deleting a trigger and
  # writing an `if:` have the identical effect.
  #
  # AND NO `needs:` ON A JOB THAT CAN ITSELF SKIP, DIRECTLY OR THROUGH ANOTHER `needs:`. READ THAT
  # AS THE LOOPHOLE IN THE PARAGRAPH ABOVE RATHER THAN AS AN EXTRA RULE: "no `if:` on these three
  # jobs" is exactly satisfied by putting the `if:` on a NEW job and reaching it with a `needs:`,
  # which is the mainstream idiom for gating an expensive job behind change detection, and the
  # dependent then skips with no `if:` anywhere near it. So the whole `needs:` graph out of these
  # three jobs is walked and every job it reaches has to be guaranteed to run too.
  #
  # AND WRITE THEM IN BLOCK STYLE. A step spelled as a YAML flow mapping (`- { if: false, run: ...
  # }`) is read by a runner exactly as the block spelling is, and the reconciliation reads this file
  # line by line, so a key inside `{ }` is at no line's head. Flow syntax in these three jobs is
  # REFUSED rather than approximated. The `${{ ... }}` expressions below are the workflow language's
  # braces, not YAML's, and are not what that rule is about.
  #
  # AND `branches: [main]` AND NOTHING ELSE ON THOSE TWO TRIGGERS. A `paths:` filter decides whether
  # this workflow STARTS AT ALL, which is quieter than an `if:`: a workflow that never starts leaves
  # a required check UNREPORTED rather than red.
  #
  # THIS IS ENFORCED, NOT REQUESTED: `reconcileWorkflowEngines` in scripts/determinism/engines.ts
  # reads this file, `pnpm run determinism:digest` and `pnpm run determinism:verify` REFUSE TO RUN
  # when it reds, and test/determinism/engine-set.test.ts walks every route. Read that file's header
  # for what a text scan over one workflow can NOT see, which is stated there rather than implied,
  # and for why it does NOT claim this file cannot be edited into a false green.
  # If one of these jobs genuinely has to become conditional, change the reconciliation deliberately
  # and say why; do not add the line and watch nothing happen.
  determinism-digest-22:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report: ${{ steps.digest.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates the declared corpus on THIS engine, checks it against the committed baseline for
      # the current compatibility window, and appends its report to GITHUB_OUTPUT.
      - name: Digest the declared corpus on this engine
        id: digest
        run: pnpm run determinism:digest

  determinism-digest-24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report: ${{ steps.digest.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Digest the declared corpus on this engine
        id: digest
        run: pnpm run determinism:digest

  determinism-digest-26:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report: ${{ steps.digest.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Digest the declared corpus on this engine
        id: digest
        run: pnpm run determinism:digest

  determinism-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [determinism-digest-22, determinism-digest-24, determinism-digest-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The reports come out of the two jobs above as job outputs, through the environment rather
      # than interpolated into the script body: a value that reaches a shell through `run:` text is
      # a script-injection surface even when we produced it ourselves.
      - name: Reassemble the per-engine digest reports
        env:
          REPORT_NODE_22: ${{ needs.determinism-digest-22.outputs.report }}
          REPORT_NODE_24: ${{ needs.determinism-digest-24.outputs.report }}
          REPORT_NODE_26: ${{ needs.determinism-digest-26.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .determinism/reports
          printf '%s' "$REPORT_NODE_22" > .determinism/reports/node-22.json
          printf '%s' "$REPORT_NODE_24" > .determinism/reports/node-24.json
          printf '%s' "$REPORT_NODE_26" > .determinism/reports/node-26.json
          wc -c .determinism/reports/node-22.json .determinism/reports/node-24.json \
            .determinism/reports/node-26.json

      - name: Compare the digests across engines
        run: pnpm run determinism:verify

      # A changed baseline means a seed maps to different bytes than it did on the default branch,
      # which is a breaking change and has to be declared as one. The fetch is explicit because
      # actions/checkout leaves no default branch behind on a pull request, and this check refuses
      # rather than passing when it cannot find one.
      - name: Fetch the default branch the baseline is compared against
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Check the compatibility window
        run: pnpm run check:determinism-window

  # ── THE EXAMPLES ─────────────────────────────────────────────────────────────────────────────
  #
  # The programs under examples/, run against the BUILT package the way a consumer imports it:
  # `pnpm examples` (scripts/run-examples.ts) fails when any example exits non-zero, and each
  # example checks its own output. Added on top of the caller above, never instead of it. Not one
  # of the determinism jobs, so the reconciliation in scripts/determinism/engines.ts does not read
  # it. `examples (22)` and `examples (24)` are new contexts and deliberately NOT required yet: let
  # them run on `main` first, then read the real names off a live check run before requiring them.
  examples:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (the examples import the built package)
        run: pnpm build

      - name: Run every example
        run: pnpm examples

  # ── THE DOCUMENTS ─────────────────────────────────────────────────────────────────────────────
  #
  # The house checks on this repository's documents and its catalog entry, from @cosyte/script-utils
  # (RD1, RD2, PF1): the README against the house skeleton and npm's size limit
  # (`pnpm check:readme`), the CLAUDE.md card against its spec (`pnpm check:claude-card`), and the
  # package description against the catalog that ships in script-utils (`pnpm check:catalog`). It
  # also runs `pnpm check:process`, @cosyte/process's `cosyte-process check`, which holds the build,
  # test, lint, typecheck and format scripts to the exact `cosyte-process` delegations, validates
  # cosyte-process.config.json, and fails a direct `vitest` that is not exactly process's pin. Not
  # one of the determinism jobs, so the reconciliation does not read it. Its context, `documents`,
  # is required by the ci-required-checks ruleset.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The README follows the house skeleton
        run: pnpm check:readme

      - name: The CLAUDE.md card follows its spec
        run: pnpm check:claude-card

      - name: The package description is the catalog's
        run: pnpm check:catalog

      - name: The process scripts delegate to @cosyte/process
        run: pnpm check:process
