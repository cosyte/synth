name: Release smoke

# Runs `pnpm smoke` (scripts/smoke.mjs) against the freshly built `dist/`: every published subpath
# loaded in BOTH ESM and CJS, its headline export resolved, a real generation exercised through it,
# and the same seed asserted to produce byte-identical output under the two module systems.
#
# WHY THIS FILE EXISTS AT ALL, STATED PLAINLY. `pnpm smoke` ran in NO CI job, here or upstream. It
# had only ever run on a local ladder outside this repository, which a contributor was not
# obliged to run and CI never ran, so no required check covered the eight published subpaths and a
# green pull request said nothing about whether they load. A gate that only runs when someone
# remembers to run it is not protecting the branch. The sibling `deid` had the same gap and closed it
# the same way, which is what makes this a class rather than an incident.
#
# WHAT THIS IS NOT. An earlier draft here said the docs had described `pnpm smoke` as a CI gate, so
# that they "assert a protection nothing provides". A refuter checked and that is FALSE for this
# repo: every surface describing this file said it ran on that local ladder, which was accurate. The sentence
# came from `deid`, where it is true, and was ported without re-measuring. The defect being fixed is
# real; it is "local-only, therefore not a gate", not "the documentation lied".
#
# IT IS NOT THE SAME CHECK AS THE SHARED PIPELINE'S "Dual ESM/CJS smoke". That upstream step is ROOT
# ENTRY ONLY: it stats `dist/index.{mjs,cjs,d.ts}` and imports/requires the root. It cannot see a
# broken `./hl7` subpath, a missing headline export, or a subpath that loads but generates nothing.
# Keep both; this one does not replace it, and deleting the upstream step is not this job's call.
#
# WHY A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. `ci.yml` is a thin caller of
# cosyte/.github's shared ci.yml, which runs a fixed ladder and no arbitrary repo
# script, so this cannot go upstream without landing on every other caller at once. Keeping it out
# of ci.yml also keeps the two context-naming conventions from being mixed in one file: ci.yml's
# contexts are `ci / <upstream job>` because `ci` is a reusable-workflow caller, and this one's is
# the bare job id below plus its matrix value.
#
# A REQUIRED JOB GATES ALL OF ITS STEPS, so `build` and `smoke` are steps of ONE job on purpose. The
# smoke reads the BUILT `dist/`, so a build in a different job would need an artifact hand-off and
# would drop the build out of the required context. Promote either to its own job and it is silently
# no longer required, with no error anywhere.
#
# AND THE JOB BOUNDARY IS NOT THE ONLY WAY TO LOSE THIS GATE. The set of subpaths the smoke loads is
# NOT a list inside the script: it is read from `package.json`'s `exports` at run time, and the
# script REFUSES to run if its per-subpath probe map and that `exports` map disagree in either
# direction. It loads the exports targets themselves rather than rebuilding `dist/<name>/index.mjs`
# by hand, so an entry pointing at a path the build does not emit fails here rather than in
# someone's install. There is no exclusion LIST either, deliberately: `./package.json` drops out
# because its target is structurally data, not because a key was named somewhere. If you replace
# either derivation with a hand-written array, this job goes back to reporting green over whatever
# subset someone last remembered.
#
# THE JOB ID PLUS THE MATRIX VALUE IS THE CHECK-RUN CONTEXT NAME (`smoke (22)`, `smoke (24)`).
# Neither is a required context on `main` yet, deliberately: requiring a context no workflow has
# emitted on `main` leaves every future pull request PENDING and unmergeable rather than failing it.
# Let this run on `main` first, read the real names off a live check run
# (`gh api repos/cosyte/synth/commits/<sha>/check-runs --jq '.check_runs[].name'`), and only then
# add them to the ruleset. After that, the job id, the matrix and the required contexts move
# together or not at all.
#
# The Node matrix mirrors `ci / verify`, because module resolution of `exports`, ESM/CJS interop and
# `require` of a dual package are exactly the kind of thing that moves between Node majors, and the
# floor is `engines.node >= 22.12.0`.
#
# `smoke-floor` RUNS THE SAME SMOKE ON THAT FLOOR, 22.12.0 EXACTLY, because a generator loads its
# parser through `require` and Node.js `require`s an ES module by default only from 22.12. Below it
# the ES module build falls back to the parser's CommonJS entry, so a generated value is not an
# instance of the class a caller imports; the smoke checks that `instanceof` under both module
# systems. The job installs and builds on the latest Node 22, since the dev tools need a newer 22,
# then runs only the smoke on the floor. test/node-floor.test.ts holds its `node-version` to the
# floor in `engines.node`, so the two move together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One job deliberately: see the banner. No `|| true`, no `continue-on-error`.
      - run: pnpm build
      - run: pnpm smoke

  smoke-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"

      - name: Smoke the build on the oldest Node.js engines.node allows
        run: |
          node --version
          node scripts/smoke.mjs
