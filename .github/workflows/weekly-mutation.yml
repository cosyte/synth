name: Weekly mutation

# The full mutation run: every source file stryker.config.mjs names (all of src/ but barrels) is
# mutated, shared out across eight runners, and the merged score is held to the floor in
# quality-floor.json. A score below its floor turns the run red. The shared job writes the score of
# each file to its summary and keeps the merged report in the `mutation-report` artifact.
#
# Twice a week: each shard keeps Stryker's incremental results in the Actions cache, so a later run
# retests only what changed, and GitHub evicts an entry nobody read for 7 days. A run every 3 or 4
# days reads each entry before it lapses.
#
# The run never commits: to raise the floor, run `pnpm mutate:full` and
# `pnpm quality:raise --skip coverage`, and open a pull request. The shared job is cosyte/.github's
# weekly-mutation.yml; the standard is cosyte/config's
# documentation/decisions/0004-the-testing-standard.md.

on:
  schedule:
    # Sunday and Wednesday 06:53 UTC. An odd minute: GitHub delays scheduled runs at the start of
    # every hour.
    - cron: "53 6 * * 0"
    - cron: "53 6 * * 3"
  workflow_dispatch:
  # Temporary: measures the full score on this branch; removed before merge.
  push:
    branches: [test/safe-providers]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    uses: cosyte/.github/.github/workflows/weekly-mutation.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      mutate-cmd: "pnpm mutate:full"
      # About seventy source files, and a suite that builds whole corpora through the parser
      # builders, so eight shards; a file is in exactly one shard, by the hash of its path.
      shard-count: 7
