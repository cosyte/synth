name: Bench

# A reading of this build on a GitHub-hosted runner: throughput, latency p50/p95/p99, allocations
# per operation, peak heap, a long run for leaks, and the cold import of the root entry with every
# file it loads and its gzip size, for every case of bench/synth.bench.mjs, the large sizes
# included, with the budgets read from it (bench/budgets.mjs). Then the profile (bench/profile.mjs):
# peak memory and the single-call time of every size of a thousand artifacts or more, throughput
# from each shape's smallest size to its largest, the cost of a seed, the cold import of each
# subpath, and a CPU and a sampled heap profile of the hottest paths.
#
# On demand, and on a pull request that changes the bench or this file, so a change to what is
# measured is measured where it will be read. ADVISORY: it fails only when it cannot measure (a
# suite that does not load, a process that dies, a results file that does not match the schema),
# never on a number, and it is never a required check. The numbers are kept as artifacts and shown
# in each job's summary.
#
# One job per shape, side by side, so the reading finishes inside a pull request's wait. Jobs on
# different runners are not compared with each other; each reading names the machine it ran on.

on:
  workflow_dispatch: {}
  push:
    branches: [perf/benchmark-audit]
  pull_request:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reading:
    name: reading (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: patients
            benchmarks: "patients: patient identities"
          - slug: hl7
            benchmarks: "hl7Corpus: HL7 v2 messages"
          - slug: fhir
            benchmarks: "fhirCorpus: FHIR resources"
          - slug: fhir-patients
            benchmarks: "fhirCorpus: FHIR US Core Patients"
          - slug: fhir-bundles
            benchmarks: "fhirCorpus: FHIR document Bundles"
          - slug: ccda
            benchmarks: "ccdaCorpus: C-CDA documents"
          - slug: x12
            benchmarks: "x12Corpus: X12 transactions"
          - slug: ncpdp-astm
            benchmarks: "ncpdpCorpus: NCPDP transactions|astmCorpus: ASTM messages"
          - slug: seeds
            benchmarks: "createRng: seed a stream and draw once|nextUint32: draw from one stream"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The lowest Node line the package supports, the one the bench-compare job runs on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read ${{ matrix.slug }}
        env:
          BENCHMARKS: ${{ matrix.benchmarks }}
          SLUG: ${{ matrix.slug }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          only=()
          IFS='|' read -r -a names <<< "${BENCHMARKS}"
          for name in "${names[@]}"; do only+=(--only "${name}"); done
          status=0
          pnpm exec cosyte-bench run --suite bench/synth.bench.mjs --target dist/index.mjs \
            --commit "${COMMIT}" "${only[@]}" \
            --out "bench-results/reading-${SLUG}.json" \
            --summary "bench-results/reading-${SLUG}.md" || status=$?
          if [ -f "bench-results/reading-${SLUG}.md" ]; then
            cat "bench-results/reading-${SLUG}.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Exit 2 with a results file is a measure the reading skipped, named in it with its typed
          # reason (a warmup that did not settle, an allocation window that always collected): a
          # skip is reported, never read as a number. Anything else is a reading that failed.
          if [ "${status}" -eq 2 ] && [ -f "bench-results/reading-${SLUG}.json" ]; then
            echo "::notice::bench reading ${SLUG}: a measure was skipped; its reason is in the results"
          elif [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          pnpm exec cosyte-bench check "bench-results/reading-${SLUG}.json"
      - name: Budgets
        env:
          SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          node bench/budgets.mjs "bench-results/reading-${SLUG}.json" \
            --summary "bench-results/budgets-${SLUG}.md"
          { echo; cat "bench-results/budgets-${SLUG}.md"; } >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reading-${{ matrix.slug }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 30

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Profile the hottest paths
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:profile --out bench-results/profile
          cat bench-results/profile/profile.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-profile
          path: bench-results/profile/
          if-no-files-found: warn
          retention-days: 30
