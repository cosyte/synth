name: Test-selection gate

# A required JOB gates its STEPS. It does not gate what those steps SELECT.
#
# `ci / verify` runs `pnpm test` and `pnpm test:coverage`, which run vitest, which runs whatever the
# `include` globs in `vitest.config.ts` select. That single repo-local line is the sole selector for
# every test in this repo: the shared `@cosyte/vitest-config` supplies no `include` of its own and
# spreads this repo's `test` block last. Narrow it to `test/hl7` and all six
# `synthetic-safety.property.test.ts` files stop running, along with the seed-sweep fuzz and the
# PHI-scanner suite, while every required check stays green and every ruleset stays as configured.
# (`test/hl7` is the example because it is the one format directory with no safety suite of its own;
# an earlier draft said `test/hl7` and `test/fhir`, which would have left one of the six running.)
#
# FOR THIS PACKAGE THAT IS THE WHOLE SAFETY STORY. `@cosyte/synth` is a synthetic-data generator.
# Its one non-negotiable promise is that no value it emits can be real or plausibly-real PHI, the
# property layer is the executable proof of that promise, and nothing named it. A generator that
# quietly starts emitting a real-looking SSN, MRN or patient name is the failure mode here, and it
# would have failed green.
#
# COVERAGE IS NOT A BACKSTOP, which is what makes this silent rather than merely risky. The coverage
# gate measures `src/**/*.ts`. The property suites re-walk `src/` paths the unit suites already
# cover and the PHI scanner lives in `scripts/`, so dropping either costs approximately zero
# coverage percent.
#
# `scripts/check-test-selection.ts` closes that by comparing the test files that EXIST against the
# test files vitest would actually RUN, and by re-proving on every run that it can still see the
# difference. It also checks the INVOCATION, because resolving the config cannot see the command
# line: narrowing the run with a path filter, an alternate `--config`, a `--project` or a `--shard`
# in the `test` / `test:coverage` scripts leaves `vitest.config.ts` looking pristine, and so does
# delegating those scripts to a third one that does any of it. That rule does not parse the script
# body; it requires an exact match against two known-good bodies, because three successive parsing
# versions in a sibling repo each shipped an evasion a refuter then found.
#
# ITS SUBJECT IS SCOPED, NOT UNIVERSAL, and the script prints the denominator on every run rather
# than a bare OK. Today 38 of 39 tracked test modules are watched by a name-independent rule, 1 by
# the `.test.`/`.spec.` filename shape alone, and 0 by no rule at all. The scope, the limits, and
# the one narrowing class this gate does NOT catch (a config that branches on its own invocation,
# measured rather than guessed) are written out in the script header.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. `ci.yml` is a thin caller of
# cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no arbitrary repo
# script. Landing this there would run it for every caller of the shared pipeline, and the sibling
# repos with the same defect have not all fixed it yet, so a shared pipeline is the wrong place for
# a rule most of its callers cannot yet satisfy. Same shape as `no-internal-refs` next door.
#
# WHY ONE JOB AND NOT TWO. The install and the check are steps of a single job on purpose.
# Promoting either into its own job would leave that half un-required unless the ruleset were edited
# in the same change, which is exactly the class of silent detachment this gate exists to answer.
#
# THE JOB ID IS THE CHECK-RUN CONTEXT NAME. `test-selection` is NOT yet a required context on
# `main`, deliberately: a required context no workflow has ever emitted on `main` leaves every
# future pull request PENDING and unmergeable, with nothing anywhere saying why. Let this run on
# `main` first, read the real context name off a live check run
# (`gh api repos/cosyte/synth/commits/<sha>/check-runs --jq '.check_runs[].name'`), and only then
# add it to the ruleset. After that, renaming this job and the required context are one edit or
# neither.
#
# Run it locally with `pnpm check:test-selection`, also reached by `pnpm check`, which is on the
# meta-repo's `scripts/verify.sh synth` ladder.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `|| true`, no `continue-on-error`: a check that cannot fail is documentation. The script
      # seeds the removals it exists to catch and requires itself to catch them before it reports
      # anything, so a green here is a green from a detector proven able to red.
      - name: Check that CI still selects every test
        run: pnpm check:test-selection
