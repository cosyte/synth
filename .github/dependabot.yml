version: 2

# Two ecosystems, because the repository has exactly two dependency surfaces: npm (`package.json`
# and `pnpm-lock.yaml` at the root, the only manifest) and github-actions (`.github/workflows/`).
# The shape is the parser template's in cosyte/config (EN5): weekly, one pull request per group, and
# a release becomes eligible a day after it is published (`cooldown`), which keeps a release pulled
# within hours out of this repository. Security updates are not delayed.
#
# Every commit message, and so every pull request title, is `chore(deps): bump ...` or
# `chore(deps-dev): bump ...`: Conventional Commits, which `pr-title.yml` checks. Without a
# prefix Dependabot guesses one from the history, and a guess is not a title rule.
#
# What the npm entry sees. The seven `@cosyte` siblings this package generates through (`hl7`,
# `fhir`, `ccda`, `x12`, `ncpdp`, `astm` and `deid`) are registry devDependencies resolved through
# `pnpm-lock.yaml`, so this entry watches the versions the tests and the determinism digest
# exercise. The siblings ARE the builders every generator emits through, so a bump can move the
# bytes a seed produces: the determinism check reds a bump that does, and the bump then needs a
# changeset that states the output change. There are ZERO runtime `dependencies` (the parsers
# are optional peers), so the production group stays empty until one is added.
#
# `pnpm.overrides` pins esbuild and js-yaml above advisory ranges, and Dependabot does not manage
# overrides: when a bump makes one redundant, remove it by hand.
#
# The cosyte/.github callers name a published `workflows-*` reference, which moves by hand with every
# caller here, not through this file.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    ignore:
      # @types/node describes the oldest Node.js this package runs on (engines: >=22.12.0), so it stays
      # on the 22 line. A newer major type-checks calls that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the vitest, typescript and prettier versions. This repository declares
      # them directly only because test files import vitest, a test uses the TypeScript compiler
      # API, and the release's `changeset version` and `version` script run Prettier from the root,
      # each pinned to exactly the version process runs. They move when process does, never alone.
      - dependency-name: "vitest"
      - dependency-name: "typescript"
      - dependency-name: "prettier"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. The
      # shared CI runs the official rhysd/actionlint release, checked by its SHA-256, instead.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together. Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
